<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Opening Inventus Control</title>
</head>

<body>
  <main>
    <h1>Opening Inventus Control</h1>
    <p id="status">Redirecting securely…</p>
  </main>

<script>
  (() => {
    const EXPECTED_ISSUER =
      "https://inventus-dev.uk.auth0.com/";

    const AUTH0_SAML_PROTOCOL_URL =
      "https://inventus-dev.uk.auth0.com/samlp/ZqecQ2OORQaCD1O8EJA6NLLeHRqsJNdj";

    const parameters =
      new URLSearchParams(window.location.search);

    const issuer = parameters.get("iss");
    const status = document.getElementById("status");

    if (issuer !== EXPECTED_ISSUER) {
      status.textContent =
        "The authentication request could not be validated.";
      return;
    }

    status.textContent =
      "Redirecting securely to Inventus Control…";

    window.location.replace(AUTH0_SAML_PROTOCOL_URL);
  })();
</script>
</body>
</html>
